<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for contacting Topo Land Services II">
    <title>Thank You | Topo Land Services II</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .thank-you {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-2xl);
            text-align: center;
            background: var(--color-bg-dark);
            position: relative;
            overflow: hidden;
        }

        .thank-you::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--color-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
        }

        .thank-you > * {
            position: relative;
            z-index: 1;
        }

        .thank-you__icon {
            width: 80px;
            height: 80px;
            margin-bottom: var(--spacing-xl);
            color: var(--color-primary);
            filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.3));
        }

        .thank-you__title {
            margin-bottom: var(--spacing-md);
            color: var(--color-text-primary);
        }

        .thank-you__text {
            max-width: 500px;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-2xl);
        }

        .thank-you__logo {
            margin-bottom: var(--spacing-2xl);
        }

        .thank-you__logo img {
            height: 48px;
            width: auto;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <main class="thank-you">
        <div class="thank-you__logo">
            <img src="logo.svg" alt="Topo Land Services II">
        </div>

        <div class="thank-you__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 12l2.5 2.5L16 9"/>
            </svg>
        </div>

        <h1 class="thank-you__title">Thank You!</h1>
        <p class="thank-you__text">
            Your message has been received. We appreciate your interest in Topo Land Services II and will get back to you as soon as possible.
        </p>

        <a href="/" class="btn btn--primary">Return to Homepage</a>
    </main>
</body>
</html>
